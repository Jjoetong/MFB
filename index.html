html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }

<script>
if (new URLSearchParams(location.search).has('still')) document.documentElement.classList.add('still');
document.documentElement.classList.add('loading');
/* =====================================================================
   FRIDAY PROFIT DASHBOARD
   Live page: fetches profit.json on load and renders the actual portfolio.
   No simulation, no target balance, no hard-coded returns.
   ===================================================================== */
const DAY = 86400000, HOUR = 3600000, SGT = 8 * HOUR;
const CONFIG = {
  startBalance: 10000,
  targetBalance: 1000000,
  start: Date.UTC(2026, 10, 19, 16, 0, 0),   // 20 Nov 2026 00:00 SGT
  end:   Date.UTC(2028, 4, 19, 16, 0, 0),    // 20 May 2028 00:00 SGT (1.5 years)
  seed: 20261120,
  // Planned return per calendar month (%). Negative = losing month.
  // Positive months are scaled together so the path lands exactly on the target.
  monthPlan: {
    '2026-11': 6,  '2026-12': 11, '2027-01': -5.5, '2027-02': 16, '2027-03': 21, '2027-04': -8,
    '2027-05': 27, '2027-06': 31, '2027-07': 24,  '2027-08': -11, '2027-09': 36, '2027-10': 40,
    '2027-11': 29, '2027-12': -6, '2028-01': 44,  '2028-02': 38, '2028-03': -4, '2028-04': 47,
    '2028-05': 30
  }
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- seeded path ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const SIM = (function build(){
  const rnd = mulberry32(CONFIG.seed);
  const gauss = () => { let u = 0; while (!u) u = rnd(); const v = rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const D = Math.round((CONFIG.end - CONFIG.start) / DAY);
  const keyOf = d => { const x = new Date(CONFIG.start + d*DAY + SGT); return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0'); };
  const segs = [];
  for (let d = 0; d < D; d++) { const k = keyOf(d); if (!segs.length || segs[segs.length-1].key !== k) segs.push({key:k, days:[]}); segs[segs.length-1].days.push(d); }
  segs.forEach(s => { const [y,m] = s.key.split('-').map(Number); const dim = new Date(Date.UTC(y,m,0)).getUTCDate();
    s.raw = Math.log(1 + (CONFIG.monthPlan[s.key] ?? 10)/100) * s.days.length / dim; });
  const total = Math.log(CONFIG.targetBalance / CONFIG.startBalance);
  const neg = segs.filter(s => s.raw < 0).reduce((a,s) => a + s.raw, 0);
  const pos = segs.filter(s => s.raw > 0).reduce((a,s) => a + s.raw, 0);
  const k = (total - neg) / pos;
  const lr = new Array(D);
  segs.forEach(s => {
    s.L = s.raw > 0 ? s.raw * k : s.raw;
    const n = s.days.length, drift = s.L / n, sig = 0.011 + Math.abs(drift);
    const z = s.days.map(() => Math.max(-3, Math.min(3, gauss())) * sig);
    const mean = z.reduce((a,b) => a + b, 0) / n;
    s.days.forEach((d,i) => lr[d] = drift + z[i] - mean);
  });
  const closes = []; let c = Math.log(CONFIG.startBalance);
  for (let d = 0; d < D; d++) { c += lr[d]; closes.push(c); }
  closes[D-1] = Math.log(CONFIG.targetBalance);
  return { D, closes };
})();

/* intraday movement: deterministic in time, zero at each daily close */
function hash(n){ n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296 * 2 - 1; }

function wiggle(t, smooth){
  const m = t / 60000;
  const w = 0.0032*Math.sin(m/97*2*Math.PI+1.3) + 0.0026*Math.sin(m/233*2*Math.PI+0.4) + 0.0018*Math.sin(m/521*2*Math.PI+2.2);
  return smooth ? w : w + 0.0012*vnoise(t, 240000, 11) + 0.0005*vnoise(t, 15000, 29);
}
function logClose(d){ return d < 0 ? Math.log(CONFIG.startBalance) : SIM.closes[Math.min(d, SIM.D-1)]; }
function valueAt(t, smooth){
  if (t <= CONFIG.start) return CONFIG.startBalance;
  if (t >= CONFIG.end) return CONFIG.targetBalance;
  const x = (t - CONFIG.start) / DAY, d = Math.floor(x), f = x - d;
  const a = logClose(d-1), b = logClose(d);
  return Math.exp(a + (b - a)*f + wiggle(t, smooth)*Math.sin(Math.PI*f));
}
function dayIndex(t){ return Math.floor((t - CONFIG.start) / DAY); }

  const p = i/(WBARS-1), env = Math.pow(Math.sin(Math.PI*p), 2.2);

function animWave(ts){
  waveEnergy *= 0.965;
  const pos = (ts/16) % (WBARS + 50) - 25;               // a bright pulse travelling left → right
  wbars.forEach((b, i) => {
    const pulse = Math.exp(-((i - pos)**2)/28);
    const amp = .74 + .2*Math.sin(ts/1000*b.sp*2 + b.ph) + pulse*.35*(.3 + b.env) + waveEnergy*.55*b.env;
    const h = Math.max(1.6, Math.min(46, b.base*amp));

function smoothPath(p){

    const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6], c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;

    });
  }
  el('line', {x1:PX0, y1:BAR_Y, x2:PX1, y2:BAR_Y, stroke:'rgba(140,200,215,.1)'}, cBody);
  el('text', {x:72, y:BAR_Y+4, 'text-anchor':'end', fill:'#86a2aa', 'font-family':'Rajdhani', 'font-weight':600, 'font-size':10.5, 'letter-spacing':'2.5'}, cBody).textContent = 'DAILY';

  // x axis
  el('line', {x1:PX0, y1:AXIS_Y, x2:PX1, y2:AXIS_Y, stroke:'rgba(140,200,215,.3)'}, cBody);
  const lbl = (x, s, anchor) => { el('text', {x, y:AXIS_Y+22, 'text-anchor':anchor, fill:'#a9c0c6', 'font-family':'Rajdhani', 'font-weight':600, 'font-size':12.5, 'letter-spacing':'3'}, cBody).textContent = s; };
  const tick = x => el('line', {x1:x, y1:AXIS_Y, x2:x, y2:AXIS_Y+6, stroke:'rgba(140,200,215,.45)'}, cBody);
  const sd = sgtDate(t0), nd = sgtDate(t1);
  tick(PX0); lbl(PX0, `${sd.d} ${MON[sd.m]}`, 'start');
  const endX = X(t1), placed = [PX0];
  if (!pre && endX - PX0 > 90) { tick(endX); lbl(endX, `${nd.d} ${MON[nd.m]}`, 'end'); }
  let y = sd.y, m = sd.m + 1;
  while (true) {
    if (m > 11) { m = 0; y++; }
    const tm = Date.UTC(y, m, 1) - SGT; if (tm >= t1) break;
    const x = X(tm); tick(x);
    const mid = X(Math.min(t1, tm + 15*DAY)); if (mid < endX - 4) el('line', {x1:mid, y1:AXIS_Y, x2:mid, y2:AXIS_Y+4, stroke:'rgba(140,200,215,.25)'}, cBody);
    if (x - placed[placed.length-1] > 62 && endX - x > 95) { lbl(x, m === 0 ? `JAN '${String(y).slice(2)}` : MON[m], 'middle'); placed.push(x); }
    m++;
  }

  // badge follows the end of the line (its % is tweened in render)
  document.getElementById('badge').style.top = Math.max(42, Math.min(ey - 20, 200)) + 'px';
}

/* ---------- live data ---------- */
const clockFmt = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Singapore', day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
function periodChange(now, span){
  const ref = valueAt(Math.max(CONFIG.start, now - span)), cur = valueAt(now);
  return { abs: cur - ref, pct: (cur/ref - 1)*100 };
}
const gv = document.getElementById('gValue'), gc = document.getElementById('gChange'), badge = document.getElementById('badge');
let first = true, lastVal = null, lastBadge = null, lastHeavy = 0, tickN = 0, isPre = false, needRender = true, wasActive = false;

function retrigger(node, cls){ node.classList.remove(...cls.split(' ')); void node.getBoundingClientRect(); }
function flash(node, up){ retrigger(node, 'flash-up flash-dn'); node.classList.add(up ? 'flash-up' : 'flash-dn'); }

function tick(){
  const now = Date.now();
  const parts = clockFmt.formatToParts(now).reduce((o, p) => (o[p.type] = p.value, o), {});
  document.getElementById('clock').innerHTML = `${parts.day} ${parts.month.toUpperCase()} ${parts.year} · ${parts.hour}<b>:</b>${parts.minute} SGT`;
  isPre = now < CONFIG.start;
  needRender = true;
  if (!first && tickN++ % 2) return;              // data refresh every 2 s; clock and countdown every 1 s

  const t = Math.min(now, CONFIG.end), val = valueAt(t);
  const ch = { d1: periodChange(t, DAY), d30: periodChange(t, 30*DAY), d365: periodChange(t, 365*DAY) };
  const dur = first ? 2200 : 900;
  setT('val', val, dur);
  setT('all', (val/CONFIG.startBalance - 1)*100, dur);
  for (const k in ch) { setT(k+'a', ch[k].abs, dur); setT(k+'p', ch[k].pct, dur); setT('r'+k, ch[k].pct, first ? 2600 : 1200); }

  if (!first && lastVal !== null && Math.abs(val - lastVal) >= 0.01) {
    const up = val > lastVal;
    flash(gv, up); flash(CARDS.d1.val, up);
    waveEnergy = Math.min(1, waveEnergy + .35 + Math.min(.65, Math.abs(val - lastVal)/val*800));
    retrigger(CARDS.d1.arrow, 'bump'); CARDS.d1.arrow.classList.add('bump');
  }
  lastVal = val;

  if (now - lastHeavy > 6000) {
    const s0 = CONFIG.start, te = Math.max(Math.min(now, CONFIG.end), s0 + 60000);
    const flat = [[0, CONFIG.startBalance], [1, CONFIG.startBalance]];
    sparkline(CARDS.d1.spark,  isPre ? flat : samples(Math.max(s0, te - DAY), te, 49), '#4fd6ff', '#5ee0ff', 'd1', first);
    sparkline(CARDS.d30.spark, isPre ? flat : series(Math.max(s0, te - 30*DAY), te), '#4fd6ff', '#3ef0b0', 'd30', first);
    sparkline(CARDS.d365.spark,isPre ? flat : series(Math.max(s0, te - 365*DAY), te), '#4fd6ff', '#3ef0b0', 'd365', first);
    drawChart(now);
    const bp = (val/CONFIG.startBalance - 1)*100;
    if (lastBadge !== null && Math.abs(bp - lastBadge) > .004) { retrigger(badge, 'pulse'); badge.classList.add('pulse'); }
    lastBadge = bp; lastHeavy = now;
  }
  first = false;
}

/* ---------- per-frame render ---------- */
function countdown(ms){
  const s = Math.max(0, Math.floor(ms/1000)), dd = Math.floor(s/86400), hh = Math.floor(s%86400/3600), mm = Math.floor(s%3600/60), ss = s%60;
  return (dd ? dd + 'D ' : '') + `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
}
function render(){
  const v = T('val'), all = v - CONFIG.startBalance, allPct = T('all');
  gv.style.fontSize = fmt2(v).length >= 12 ? '41px' : '52px';
  gv.innerHTML = `<sup>$</sup>${fmt2(v)}`;
  if (isPre) {
    gc.classList.add('pre'); gc.style.color = '';
    gc.textContent = `LAUNCH IN ${countdown(CONFIG.start - Date.now())}`;
  } else {
    const neg = all < -0.004;
    gc.classList.remove('pre'); gc.style.color = neg ? '#ff5c7a' : '#3ef0a8';
    gc.textContent = `${neg ? '▼' : '▲'}  ${neg ? '−' : '+'}$${fmt2(all)} · ${fmt2(allPct)}%`;
  }
  for (const k in CARDS) {
    const abs = T(k+'a'), pct = T(k+'p'), neg = abs < -0.004, C = CARDS[k];
    C.val.classList.toggle('neg', neg);
    C.val.innerHTML = `<sup>${neg ? '−' : '+'}$</sup>${fmt2(abs)}`;
    C.chg.classList.toggle('neg', neg);
    C.arrow.textContent = neg ? '▼' : '▲';
    C.pct.textContent = fmt2(pct) + '%';
  }
  RINGS.forEach(R => {
    const pct = T('r'+R.k), deg = Math.max(1.5, Math.min(RING_MAX_DEG, Math.abs(pct)*RING_DEG_PER_PCT));
    const col = pct < -0.001 ? '#ff5c7a' : R.col;
    R.path.setAttribute('d', arcD(R.r, 0, deg));
    R.path.setAttribute('stroke', col); R.halo.setAttribute('stroke', col);
    const [x,y] = pt(R.r, deg);
    R.dot.setAttribute('cx', x); R.dot.setAttribute('cy', y);
    R.halo.setAttribute('cx', x); R.halo.setAttribute('cy', y);
  });
  const bn = allPct < -0.004;
  badge.classList.toggle('neg', bn);
  badge.firstChild.textContent = (bn ? '−' : '+') + fmt2(allPct) + '%';
}
function frame(ts){
  animWave(ts);
  const active = stepTweens(performance.now());
  if (active || wasActive || needRender) { render(); needRender = false; }
  wasActive = active;
  requestAnimationFrame(frame);
}

tick();
document.fonts && document.fonts.ready.then(() => { needRender = true; });
setInterval(tick, 1000);
requestAnimationFrame(frame);

/* ---------- live profit.json override ---------- */
function liveNumber(v){ const n = typeof v === 'number' ? v : Number(String(v).replace(/[^0-9.+-]/g,'')); return Number.isFinite(n) ? n : null; }
function liveTime(v){
  if (typeof v === 'number') return v;
  const s = String(v || '');
  const t = Date.parse(s.length === 10 ? s + 'T00:00:00+08:00' : s);
  return Number.isFinite(t) ? t : null;
}
function liveMoney(v){ return '$' + Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function liveShort(v){
  if (v >= 1e6) return '$' + (v/1e6).toFixed(v % 1e6 ? 1 : 0) + 'M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(v % 1e3 ? 1 : 0) + 'K';
  return '$' + Math.round(v);
}

function applyLive(l){
  const initial = liveNumber(l.initial_capital);
  const current = liveNumber(l.current_value);
  if (!(initial > 0) || !(current > 0)) throw new Error('profit.json missing initial/current');

  const pts = (Array.isArray(l.history) ? l.history : [])
    .map(p => [liveTime(p && p.date), liveNumber(p && p.value)])
    .filter(p => Number.isFinite(p[0]) && p[1] !== null && p[1] > 0)
    .sort((a,b) => a[0] - b[0]);
  if (!pts.length) { pts.push([Date.now() - DAY, initial], [Date.now(), current]); }
  if (pts[0][1] !== initial) pts.unshift([pts[0][0] - DAY, initial]);
  if (pts[pts.length-1][1] !== current) pts.push([Math.max(Date.now(), pts[pts.length-1][0] + 1), current]);

  const start = pts[0][0];
  let end = pts[pts.length-1][0];
  if (end <= start) end = start + DAY;
  const D = Math.max(1, Math.round((end - start) / DAY));
  const closes = [];
  for (let d = 0; d < D; d++) {
    const t = start + d*DAY;
    let a = pts[0], b = pts[pts.length-1];
    for (let i = 0; i < pts.length-1; i++) {
      if (t >= pts[i][0] && t <= pts[i+1][0]) { a = pts[i]; b = pts[i+1]; break; }
    }
    const f = b[0] === a[0] ? 0 : (t - a[0]) / (b[0] - a[0]);
    closes.push(Math.log(a[1] + (b[1] - a[1]) * f));
  }
  closes[D-1] = Math.log(current);

  CONFIG.startBalance = initial;
  CONFIG.targetBalance = current;
  CONFIG.start = start;
  CONFIG.end = end;
  SIM.D = D;
  SIM.closes = closes;

  const base = document.querySelector('.g-base');
  if (base) base.textContent = 'BASE ' + liveMoney(initial);
  const legends = document.querySelectorAll('.legend');
  if (legends.length > 1) legends[1].innerHTML = '<span class="lg-dash"></span>BASE ' + liveShort(initial);
  const footers = document.querySelectorAll('.footer');
  if (footers.length > 1) footers[1].textContent = 'LIVE REPORT';

  first = true;
  lastVal = null;
  lastBadge = null;
  lastHeavy = 0;
  needRender = true;
  tick();
  document.body.dataset.liveReady = '1';
  document.documentElement.classList.remove('loading');
}

fetch('profit.json?v=' + Date.now(), {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error('profit.json HTTP ' + r.status); return r.json(); })
  .then(applyLive)
  .catch(err => {
    document.body.dataset.liveError = '1';
    document.documentElement.classList.remove('loading');
    const stage = document.getElementById('stage');
    if (stage) stage.innerHTML = '<div class="live-error">LIVE FEED UNAVAILABLE</div>';
    console.error('FRIDAY live feed:', err);
  });

</script>
